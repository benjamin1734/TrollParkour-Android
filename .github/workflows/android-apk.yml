name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/godot" /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          curl -L --fail --retry 3 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --version
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=TrollParkour,C=TR"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

      - name: Import Godot project
        shell: bash
        run: |
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --import --verbose

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-runtime.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --quit-after 120 --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "BOOT_OK:TrollParkour menu ready" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call" "$LOG"; then exit 1; fi

      - name: Validate death echo retry
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-death-echo.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v26_death_echo.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "DEATH_ECHO_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|DEATH_ECHO_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate death route trace
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-route-trace.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v28_route_trace.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "ROUTE_TRACE_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|ROUTE_TRACE_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate active risk sync
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-risk-sync.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v29_risk_sync.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "RISK_SYNC_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|RISK_SYNC_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate lazy moving platforms
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-mover-activation.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v30_mover_activation.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "MOVER_ACTIVATION_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|MOVER_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate boulder balance
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-boulder-balance.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v30_boulder_balance.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "BOULDER_BALANCE_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|BOULDER_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate visual overhaul phase 1
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-visual-overhaul.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v31_visual_overhaul.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "VISUAL_OVERHAUL_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|VISUAL_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate visual overhaul phase 2
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-visual-phase2.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v32_visual_phase2.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "VISUAL_PHASE2_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|VISUAL_PHASE2_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate visual overhaul phase 3
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-visual-phase3.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v33_visual_phase3.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "VISUAL_PHASE3_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|VISUAL_PHASE3_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate Developer Tool flow
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-v34-hotfix.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v34_hotfix.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "V34_HOTFIX_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|V34_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate double jump and global balance
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-v34-gameplay.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v34_gameplay_hotfix.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "V34_GAMEPLAY_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|V34_GAMEPLAY_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate human playability contracts across 78 maps
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-v35-rebuild.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v35_full_rebuild.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "V35_FULL_REBUILD_OK:78" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|V35_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate chapter 26 inversion phase
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-v36-chapter26.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v36_chapter26.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "V36_CHAPTER26_OK" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|V36_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate idle anti-spoiler across 78 maps
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-idle-spoilers.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --script res://tests/validate_v30_idle_spoilers.gd --verbose >"$LOG" 2>&1
          cat "$LOG"
          grep -q "IDLE_SPOILER_OK:78" "$LOG"
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|IDLE_SPOILER_VALIDATE" "$LOG"; then exit 1; fi

      - name: Validate all 78 maps
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/trollparkour-all-levels.log
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --verbose -- --validate-all-levels >"$LOG" 2>&1
          cat "$LOG"
          grep -q "ALL_LEVELS_OK:78" "$LOG"
          test "$(grep -c 'LEVEL_VALIDATE_OK:' "$LOG")" -eq 78
          if grep -Eq "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Nonexistent function|Attempt to call|LEVEL_VALIDATE_FAIL|ALL_LEVELS_FAILED" "$LOG"; then exit 1; fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" --headless --path . --export-debug Android artifact/TrollParkour-v3.6-debug.apk --verbose
          test -s artifact/TrollParkour-v3.6-debug.apk
          ls -lh artifact/TrollParkour-v3.6-debug.apk

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs artifact/TrollParkour-v3.6-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollParkour-v3.6-Android-APK
          path: artifact/TrollParkour-v3.6-debug.apk
          if-no-files-found: error
          retention-days: 30
