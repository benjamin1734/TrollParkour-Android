name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Create debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=TrollParkour,C=TR"
          fi

      - name: Export Android APK with Godot 4.3
        id: godot_export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: build
          export_debug: true
          cache: true
          verbose: true
          presets_to_export: Android

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifact
          APK_PATH="$(find . -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK generated."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "APK: $APK_PATH"
          cp "$APK_PATH" artifact/TrollParkour-v0.1-debug.apk
          ls -lh artifact/TrollParkour-v0.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollParkour-v0.1-Android-APK
          path: artifact/TrollParkour-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
